# GoReleaser configuration for EnvGuard. Local dry run: `make snapshot`.
# Release: push a v* tag; .github/workflows/release.yml runs GoReleaser.
# Docs: https://goreleaser.com
version: 2

project_name: envguard

builds:
  - id: envguard
    main: ./cmd/envguard
    binary: envguard
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .CommitDate }}
    # Reproducible builds: file times come from the commit, not the clock.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: envguard
    ids: [envguard]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # envguard_1.2.3_linux_amd64.tar.gz — install.sh, the GitHub Action and
    # scripts/npm/build.mjs rely on this exact name.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX SBOM per archive (needs syft on PATH).
sboms:
  - id: archives
    artifacts: archive

# Keyless signing of checksums.txt with Sigstore (GitHub OIDC in CI). The
# bundle holds signature + certificate; see docs/installation.md to verify.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    output: true

nfpms:
  - id: packages
    ids: [envguard]
    package_name: envguard
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: EnvGuard
    homepage: https://github.com/ardamoustafa1/envguard
    maintainer: EnvGuard maintainers <noreply@users.noreply.github.com>
    description: Catch environment-variable and configuration mistakes before you deploy.
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    section: devel
    contents:
      - src: LICENSE
        dst: /usr/share/doc/envguard/LICENSE
      - src: README.md
        dst: /usr/share/doc/envguard/README.md

# Multi-arch image: ghcr.io/ardamoustafa1/envguard:{1.2.3,1.2,1,latest}.
dockers_v2:
  - id: envguard
    ids: [envguard]
    dockerfile: Dockerfile
    images:
      - ghcr.io/{{ envOrDefault "GITHUB_REPOSITORY_OWNER" "ardamoustafa1" | tolower }}/envguard
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: envguard
      org.opencontainers.image.description: Catch environment-variable and configuration mistakes before you deploy.
      org.opencontainers.image.source: https://github.com/ardamoustafa1/envguard
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: MIT

# Keyless signature of the pushed images.
docker_signs:
  - id: images
    cmd: cosign
    artifacts: manifests
    args:
      - sign
      - ${artifact}@${digest}
      - --yes

# Homebrew tap (ardamoustafa1/homebrew-tap). GoReleaser v2.10+ deprecated
# `brews` (formulae for prebuilt binaries) in favor of casks; users still run
# `brew install ardamoustafa1/tap/envguard`.
homebrew_casks:
  - name: envguard
    ids: [envguard]
    binaries: [envguard]
    repository:
      owner: ardamoustafa1
      name: homebrew-tap
      token: "{{ envOrDefault \"HOMEBREW_TAP_GITHUB_TOKEN\" \"\" }}"
    directory: Casks
    homepage: https://github.com/ardamoustafa1/envguard
    description: Catch environment-variable and configuration mistakes before you deploy
    license: MIT
    commit_author:
      name: envguard-release-bot
      email: noreply@users.noreply.github.com
    hooks:
      post:
        # The binary is not notarized; drop the quarantine flag so macOS
        # does not block it. Integrity is covered by the signed checksums.
        install_steps: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/envguard"]
          end

scoops:
  - name: envguard
    ids: [envguard]
    repository:
      owner: ardamoustafa1
      name: scoop-bucket
      token: "{{ envOrDefault \"SCOOP_BUCKET_GITHUB_TOKEN\" \"\" }}"
    homepage: https://github.com/ardamoustafa1/envguard
    description: Catch environment-variable and configuration mistakes before you deploy.
    license: MIT
    commit_author:
      name: envguard-release-bot
      email: noreply@users.noreply.github.com

release:
  github:
    owner: ardamoustafa1
    name: envguard
  draft: false
  prerelease: auto
  footer: |
    Verify the download: see [docs/installation.md](https://github.com/ardamoustafa1/envguard/blob/main/docs/installation.md#verifying-downloads).

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
