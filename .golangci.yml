version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - revive
    - gocritic
    - misspell
    - unparam
    - errorlint
  settings:
    misspell:
      locale: US
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-naming
        - name: error-return
        - name: errorf
        - name: blank-imports
        - name: context-as-argument
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: unused-parameter
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
        - whyNoLint
      settings:
        # parser.Entry is ~184 bytes; copying it in loops is cheaper than the
        # readability cost of index-only loops everywhere.
        rangeValCopy:
          sizeThreshold: 512
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      # Tests legitimately use fixed file permissions, temp paths and exec.
      - path: _test\.go
        linters:
          - gosec
      # Test-only helpers (golden files) read and write paths chosen by tests.
      - path: internal/testutil/
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
