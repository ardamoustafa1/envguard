version: 1
profiles: [production-safety]
variables:
  PORT:
    type: port
    description: HTTP port the API listens on
  LOG_LEVEL:
    type: enum
    values: [debug, info, warn, error]
  DATABASE_URL:
    type: url
    schemes: [postgres, postgresql]
    required: true
    sensitive: true
  WORKERS:
    type: int
    min: 1
    max: 64
