name: release

# Push a tag like v1.2.3 to release. GoReleaser builds and publishes the
# archives, checksums (signed keylessly with cosign), SBOMs, deb/rpm/apk,
# the Docker image on ghcr.io, the Homebrew cask and the Scoop manifest;
# the npm job then publishes the npm packages with provenance.
on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
      packages: write # push the image to ghcr.io
      id-token: write # keyless cosign signing (Sigstore OIDC)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # GoReleaser needs the tags for the changelog
      - uses: actions/setup-go@v6
        with:
          # go.mod sets the supported minimum, not the release compiler patch.
          go-version: stable
          cache: true
      - name: Test
        run: go test ./...
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PATs with contents: write on the tap / bucket repos.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
      - name: Move the major tag for the GitHub Action (v1 → this release)
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          major="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$TAG^{commit}"
          git push -f origin "refs/tags/$major"
      - name: Keep binaries for the npm job
        uses: actions/upload-artifact@v4
        with:
          name: goreleaser-dist
          path: |
            dist/artifacts.json
            dist/metadata.json
            dist/envguard_*/envguard
            dist/envguard_*/envguard.exe
          if-no-files-found: error
          retention-days: 3

  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v5
        with:
          name: goreleaser-dist
          path: dist
      - name: Build npm packages
        run: node scripts/npm/build.mjs --dist dist --out dist/npm --smoke
      - name: Publish (platform packages first, then the launcher)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          while read -r pkg; do
            [ -n "$pkg" ] || continue
            version=$(node -p "require('./dist/npm/$pkg/package.json').version")
            tag=latest
            case "$version" in *-*) tag=next ;; esac
            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "$pkg@$version is already published; skipping"
              continue
            fi
            (cd "dist/npm/$pkg" && npm publish --provenance --access public --tag "$tag")
          done < dist/npm/publish-order.txt
