name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  security:
    name: gosec + govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - run: make security

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck install.sh
        run: shellcheck --version && shellcheck install.sh

  # EnvGuard checks this repository (config: .envguard.yaml). Findings become
  # pull request annotations and a job summary.
  dogfood:
    name: envguard (dogfood)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - name: envguard check
        run: go run ./cmd/envguard check

  release-dry-run:
    name: goreleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/setup-buildx-action@v3
      - name: Validate .goreleaser.yaml
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.19.0
          args: check
      - name: Snapshot (archives, packages, image, npm; nothing is published)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.19.0
          args: release --snapshot --clean --skip=sign
      - name: Build and smoke-test the npm packages
        run: node scripts/npm/build.mjs --dist dist --out dist/npm --smoke
      - name: install.sh against the snapshot
        run: |
          set -eu
          version=$(node -p "require('./dist/metadata.json').version")
          mkdir -p "mirror/download/v$version"
          cp dist/checksums.txt dist/*.tar.gz dist/*.zip "mirror/download/v$version/"
          python3 -m http.server 8765 --directory mirror >/dev/null 2>&1 &
          sleep 1
          ENVGUARD_RELEASES_URL=http://127.0.0.1:8765 ENVGUARD_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh "$version"
          "$RUNNER_TEMP/bin/envguard" version | grep -q "envguard $version"
      - name: Keep the generated Scoop package for Windows testing
        uses: actions/upload-artifact@v4
        with:
          name: scoop-snapshot
          path: |
            dist/scoop/envguard.json
            dist/envguard_*_windows_amd64.zip
            dist/checksums.txt
            dist/metadata.json
          if-no-files-found: error
          retention-days: 3

  scoop:
    name: Scoop install (Windows x64)
    needs: release-dry-run
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v5
        with:
          name: scoop-snapshot
          path: ${{ runner.temp }}/scoop-snapshot
      - name: Install the generated package with an isolated Scoop
        shell: pwsh
        run: ./scripts/test-scoop.ps1 -SnapshotDir "$env:RUNNER_TEMP/scoop-snapshot" -EvidenceDir "$env:RUNNER_TEMP/scoop-evidence"
      - name: Keep Scoop test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoop-windows-x64-evidence
          path: ${{ runner.temp }}/scoop-evidence
          if-no-files-found: warn
          retention-days: 3
