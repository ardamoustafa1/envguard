name: False positive
description: A rule reported something that is not a problem.
labels: ["false-positive"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real secrets or real values.** Replace every value with a fake one
        and keep only the lines needed to reproduce the finding.
        EnvGuard prefers missing a finding over reporting a wrong one, so these reports matter.
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: EG003
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: The finding line as printed
      description: Copy the line from `envguard check`.
      render: text
      placeholder: "  3:26  ⚠ warning  EG003  OPTIONAL_FLAG is read by the code but not declared in any env file, template or schema"
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Minimal redacted snippet
      description: |
        The smallest set of files that reproduces it. Use fake values such as `changeme`.
        Do not paste real secrets, tokens, passwords or URLs with credentials.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EnvGuard version
      description: Output of `envguard version`.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Why this is not a problem, and what EnvGuard should do instead.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I replaced every real value in the snippet with a fake one.
          required: true
